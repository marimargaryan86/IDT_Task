name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Needed to publish the Allure report to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --configuration Debug

      # Playwright downloads its own browser; --with-deps adds the Linux system libraries it needs.
      - name: Install Playwright browser
        run: pwsh bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      # Settings come from .runsettings (headless, sequential). The site is public and sometimes answers
      # HTTP 503, so a red run is not always a code problem: read the failure evidence first.
      - name: Run tests
        run: dotnet test --no-build --configuration Debug

      # Allure results, plus screenshots and traces of failed tests. Kept even when the tests fail.
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            bin/Debug/net10.0/allure-results
            bin/Debug/net10.0/TestResults
          if-no-files-found: ignore
          retention-days: 14

      # Build the HTML report from the results (also when tests failed) and stage it for GitHub Pages.
      - uses: actions/setup-java@v4
        if: always()
        with:
          distribution: temurin
          java-version: 17

      - name: Build Allure report
        if: always()
        run: |
          if [ -d bin/Debug/net10.0/allure-results ]; then
            npm install --global allure-commandline@2.32.0
            allure generate bin/Debug/net10.0/allure-results -o allure-report --clean
          else
            echo "No Allure results, no report."
          fi

      - name: Stage report for GitHub Pages
        if: always() && hashFiles('allure-report/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  # Publishes the report at https://<user>.github.io/IDT_Task/ (only for pushes to main, not pull requests).
  # One-time setup: repository Settings -> Pages -> Source: GitHub Actions.
  publish-report:
    needs: test
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
